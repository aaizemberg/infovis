<!DOCTYPE html>
<html>
<head>
	<title>Leaflet con los Tiles de la USIG</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">	
	<link rel="shortcut icon" type="image/x-icon" href="docs/images/favicon.ico" />
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.0.1/dist/leaflet.css" />
	<script src="https://unpkg.com/leaflet@1.0.1/dist/leaflet.js"></script>
  </head>
<body>

<div id="mapid" style="width: 600px; height: 400px;"></div>
<script>
  var mymap = L.map('mapid').setView([-34.604916,-58.3900979], 11);
  var url = 'http://tiles1.usig.buenosaires.gob.ar/mapcache/tms/1.0.0/amba_con_transporte_3857@GoogleMapsCompatible/{z}/{x}/{y}.png';  
  var tms_ne = L.tileLayer(url, {
    tms: true
  }).addTo(mymap);
  
</script>

</body>
</html>
