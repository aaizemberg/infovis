<!DOCTYPE html>
<html>
  <head>
    <title>Muertos en la Argentina por el Coronavirus - promedio móvil de 7 días</title>
    <script src="https://cdn.jsdelivr.net/npm/vega@5.10.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@4.7.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.3.2"></script>
  </head>
  <body>
    <div id="vis"></div>

    <p><small>
    source:
    <a href="https://data.world/covid-19-data-resource-hub/covid-19-case-counts">data.world COVID-19 Activity</a>,
    <a href="https://www.tableau.com/covid-19-coronavirus-data-resources">COVID-19 Data Hub</a>
    </small></p>

    <script>
      var vegalite_spec = {
  "$schema": "https://vega.github.io/schema/vega-lite/v2.json",
  "width" : window.innerWidth - 160,
  "mark": {"type": "bar", "size": ((window.innerWidth < 500) ? 1 : 3), "color": "#e41a1c", "tooltip": true},
  "encoding": {
    "x": {
      "field": "date",
      "type": "temporal",
      "scale": {"type": "linear", "zero": true},
      "title": "fecha"
    },
    "y": {
      "field": "promedio_movil",
      "type": "quantitative",
      "scale": {"type": "linear", "zero": true},
      "title": "promedio móvil (7 dias)"
    }
  },
  "data": {
    "url": "https://download.data.world/s/pch2necevm5ryyg3umc62oqnklnaox",
    "format": {"type": "csv"}
  },
  "transform": [
    {
      "window": [
        {"op": "average", "field": "count", "as": "promedio_movil"}
      ],
      "sort": [{"field": "date", "order": "ascending"}],
      "frame": [7, 0]
    }
  ],
  "config": {"background": "#ffffff", "padding": 10}
};
      vegaEmbed('#vis', vegalite_spec);
    </script>
  </body>
</html>
