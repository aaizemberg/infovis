<!doctype html>
<html>
<head>
  <title>Network | Basic usage</title>

<!--
  <script src="//visjs.org/dist/vis.js"></script>
  <link href="//visjs.org/dist/vis.css" rel="stylesheet" type="text/css" />
-->

  <script src="vis.js"></script>
  <link href="vis.css" rel="stylesheet" type="text/css" />
  
  <style type="text/css">
    #mynetwork {
      width: 100%;
      height: 600px;
      border: 1px solid lightgray;
    }
  </style>
</head>
<body>

<div id="mynetwork"></div>

<script>
  var nodes = new vis.DataSet([
    {id: 1, label: '3-diciembre', shape: 'circle'},
    {id: 2, label: '16-septiembre', shape: 'circle'},
    {id: 3, label: '4-enero', shape: 'circle'},
    {id: 4, label: '30-abril', shape: 'circle'},
    {id: 5, label: '31-octubre', shape: 'circle'},
    {id: 6, label: 'ARIEL', shape: 'box'},
    {id: 7, label: 'DANIELA', shape: 'box'},
    {id: 8, label: 'BRUNO', shape: 'box'},
    {id: 9, label: 'JUANA', shape: 'box'},
    {id: 10, label: 'FELISA', shape: 'box'},
    {id: 11, label: '6-febrero', shape: 'circle'},
    {id: 12, label: 'SARA', shape: 'box'}
  ]);

  var edges = new vis.DataSet([]);

  var container = document.getElementById('mynetwork');
  var data = {
    nodes: nodes,
    edges: edges
  };
  var options = {'physics':false};
  var network = new vis.Network(container, data, options);
</script>

</body>
</html>
