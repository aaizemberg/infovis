<!doctype html>
<html>
<head>
  <title>Network | Circular images</title>

  <style type="text/css">
    body {
      font: 10pt arial;
    }
    #mynetwork {
      width: 600px;
      height: 500px;
      border: 1px solid lightgray;
      background-color:#333333;
    }
  </style>

  <script src="//visjs.org/dist/vis.js"></script>
  <link href="//visjs.org/dist/vis.css" rel="stylesheet" type="text/css" />

  <script> 
    var nodes = null;
    var edges = null;
    var network = null;

    function draw() {
      nodes = [
        {id: 'mauriciomacri',  label: 'mm', title: '<b>Mauricio Macri</b><br/>Presidencia',  shape: 'circularImage', image: 'https://pbs.twimg.com/profile_images/653558348273569792/joxg8DZD_400x400.png'},
        {id: 'marquitospena',  label: 'mp', title: '<b>Marcos Peña</b><br/>Jefe de Ministros',  shape: 'circularImage', image: 'https://pbs.twimg.com/profile_images/756255471670005760/_kcdpP7r_400x400.jpg'}
      ];

      edges = [
        {from: 'mauriciomacri', to: 'marquitospena', arrows:'to'}
      ];

      var container = document.getElementById('mynetwork');
      var data = {
        nodes: nodes,
        edges: edges
      };
      var options = {
        nodes: {
          borderWidth:4,
          size:30,
	      color: {
            border: '#222222',
            background: '#666666'
          },
          font:{color:'#eeeeee'}
        },
        edges: {
          color: 'lightgray'
        }
      };
      network = new vis.Network(container, data, options);
    }

  </script>
</head>

<body onload="draw()">

<div id="mynetwork"></div>
</body>
</html>
