    var nodes = null;
    var edges = null;
    var network = null;
    var directionInput = document.getElementById("direction");
    var sel;
    var parametros;

    var data;

    var colores = {
  "Desarrollo Profesional": "#1f78b4",
  "Economía y Desarrollo Profesional": "#b2df8a",
  "Electrónica": "#33a02c",
  "Física": "#fb9a99",

  "Mecánica": "#ff7f00",
  "Quimica": "#cab2d6",
  "Secretaria Academica": "#6a3d9a",
  "Bioingeniería": "#fee0d2"
};

var cuat2symbol = {
  "1" : "triangle",
  "2" : "triangleDown",
  "3" : "dot",
  "#N/A" : "box"
};

    function destroy() {
        if (network !== null) {
            network.destroy();
            network = null;
        }
    }

    function draw() {
        destroy();

        nodes = [];

        function addNodes(d) {
          var valor = 1;
   		  if (d.prom_alumnos !== "#N/A") {
   		  	valor = d.prom_alumnos;
   		  }
          if (d['ultima'] > 2015) {
            nodes.push({
              id: d.id,
              label: d.id,
              level: d.orden,
              title: d.materia,
              value: valor,
              shape: cuat2symbol[d.cant_cuat],
              color: { background: colores[d.depto], border: colores[d.depto], highlight: {background:'white',border:colores[d.depto]} }
            });
          }
        }

        datos.forEach(addNodes);

        edges = [];
        var connectionCount = [];

        function addLinks(d) {
            edges.push({from: d.from, to: d.to});
        }
        links.forEach(addLinks);

        var container = document.getElementById('mynetwork');
        data = {
            nodes: nodes,
            edges: edges
        };

        var options = {
            edges: {
                smooth: {
                    type: 'cubicBezier',
                    forceDirection: (directionInput.value == "UD" || directionInput.value == "DU") ? 'vertical' : 'horizontal',
                    roundness: 0.4
                }, shadow: false
            },
            nodes: {
              borderWidth: 1,
              shape: 'dot',
              shadow: true,
              scaling: {
			              customScalingFunction: function (min,max,total,value) {
			                return 2*(value)/max;
			              },
			              min:5,
			              max:25
			              }
            },
            layout: {
                hierarchical: {
                    direction: directionInput.value
                }
            },
            physics: true
        };
        network = new vis.Network(container, data, options);

        // add event listeners
        network.on('select', function (params) {
            parametros = params;
            // console.log( "Params: " + params );
            if (parametros.nodes.length == 1) {
              var sel = _.filter(datos, { 'id': params.nodes[0] });
              // document.getElementById('selection').innerHTML = 'Materia seleccionada: ' + params.nodes;
              var ad = "";
              if (sel[0].prom_alumnos == "#N/A") {
                ad = "";
              }
              else {
                ad = ", alumnos: " + sel[0].prom_alumnos + ", docentes: " + sel[0].docentes;
              }
              document.getElementById('selection').innerHTML = "id: " + sel[0].id + " <b>" + sel[0].materia + "</b> profesor a cargo: <b>" + sel[0].profesor + "</b> <a href='mailto:" + sel[0].email + "'>" + sel[0].email+ "</a> Depto: " + sel[0].depto + ad;
            }
        });

        /** network.on("click", function (params) {
              params.event = "[original event]";
              document.getElementById('selection').innerHTML = JSON.stringify(params, null, 4);
              console.log('click event, getNodeAt returns: ' + this.getNodeAt(params.pointer.DOM));
            }); **/

    }

    var directionInput = document.getElementById("direction");
    var btnUD = document.getElementById("btn-UD");
    btnUD.onclick = function () {
        directionInput.value = "UD";
        draw();
    };
    var btnDU = document.getElementById("btn-DU");
    btnDU.onclick = function () {
        directionInput.value = "DU";
        draw();
    };
    var btnLR = document.getElementById("btn-LR");

        directionInput.value = "LR";
        draw();
    };
    var btnRL = document.getElementById("btn-RL");
    btnRL.onclick = function () {
        directionInput.value = "RL";
        draw();
    };


</script>
