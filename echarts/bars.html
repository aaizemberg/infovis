<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Evolucion del patrimonio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/4.6.0/echarts-en.min.js"></script>
</head>
<body>
    <div id="main" style="width: 600px;height:400px;"></div>
    <script>
        var myChart = echarts.init(document.getElementById('main'));

        var option = {
            title: {
                text: 'Evolución del patrimonio de Mauricio Macri'
            },
            tooltip: {},
            legend: { data:['Patrimonio'] },
            xAxis: {
                data: ["2015", "2019"]
            },
            yAxis: {},
            series: [{
                name: 'Patrimonio [Millones de $]',
                type: 'bar',
                data: [100, 147]
            }]
        };
        myChart.setOption(option);
    </script>
</body>
</html>
