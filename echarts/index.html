<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/4.8.0/echarts.js"></script>
    <title>Precio del pescado en el Mercado Central de Bs As</title>
</head>
  
<body>
  <div id="main" style="width:600px; height:400px;"></div>
  <script>
        var myChart = echarts.init(document.getElementById('main'));
        var option = {
          title: {
            text: 'Precio del pescado en el Mercado Central de Bs As (2019)'
          },
          xAxis: { 
            data: ["2019-01","2019-02","2019-03","2019-04","2019-05","2019-06","2019-07","2019-08","2019-09","2019-10","2019-11","2019-12"],
            type: 'category'
          },
          yAxis: {
            type: 'value'
          },
          tooltip: {
            trigger: 'axis',
/**            
            formatter: function (params) {
              return 'Merluza (kg) $' + params[0].value + '<br>Gatuso (kg) $' + params[1].value;
            },
**/
            axisPointer: {
              type: 'cross',
              label: {
                backgroundColor: '#6a7985'
              }
            }
          },
          series: [
            {
              name: 'Merluza',
              data: [122, 130, 133, 154, 134, 143, 147, 147, 165, 155, 147, 156],
              type: 'line'
            },
            {
              name: 'Gatuso',
              data: [122, 155, 157, 172, 150, 176, 177, 169, 170, 176, 182, 198],
              type: 'line'
            }
          ]
        };
        myChart.setOption(option);
    </script>
</body>  
  
</html>
