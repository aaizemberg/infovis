<!doctype html>
<meta charset="utf-8">
<script src="//d3plus.org/js/d3.js"></script>
<script src="//d3plus.org/js/d3plus.js"></script>
<div id="viz"></div> 

<script>
  d3.csv("data.csv", function(data) {
  	console.log( data[0] );
	// countries=ar,pe&types=ley,proyecto
	// 

    // para cada registro, agrego una una variable, para el treemap
    data.forEach(function(d) {    
      d["cantidad"] = 1;
    })

    var visualization = d3plus.viz()
//    .font("transform","lowercase")
      .format('es_ES')
      .format({text:function(text){return text;}})
      .container("#viz")  
      .data( data )  
      .type("tree_map")   
      .id(["objetivo_legitimo","pais"])         
      .size("cantidad") 
      .time({"value": "anio"})     
      .draw();       

  });

</script>
