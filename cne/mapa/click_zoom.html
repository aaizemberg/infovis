<body>
  <div id="viz"></div>

<script>

  var sample_data = [
    {"consumo (kWh)": 261246750, "id": "CL-TA", "region": "Tarapacá"},
    {"consumo (kWh)": 443529819, "id": "CL-AN", "region": "Antofagasta"},
    {"consumo (kWh)": 191762427, "id": "CL-AT", "region": "Atacama"},
    {"consumo (kWh)": 446180175, "id": "CL-CO", "region": "Coquimbo"},
    {"consumo (kWh)": 1324935857, "id": "CL-VS", "region": "Valparaíso"},
    {"consumo (kWh)": 591846388, "id": "CL-LI", "region": "Libertador General Bernardo O'Higgins"},
    {"consumo (kWh)": 630061274, "id": "CL-ML", "region": "Maule"},
    {"consumo (kWh)": 1239599828, "id": "CL-BI", "region": "Biobío"},
    {"consumo (kWh)": 502668708, "id": "CL-AR", "region": "Araucanía"},
    {"consumo (kWh)": 528451723, "id": "CL-LL", "region": "de Los Lagos"},

    .type("geo_map")
    .coords({
      "solo": ["CL-TA","CL-AN","CL-AT","CL-CO","CL-VS","CL-LI","CL-ML","CL-BI","CL-AR","CL-LL","CL-AI","CL-MA","CL-LR","CL-AP","CL-RM"],
      "value": "regiones1e3.topojson"
    })
    .id("id")
    .text("region")
    .color("consumo (kWh)")
    .tooltip("region")
    .draw()

</script>
