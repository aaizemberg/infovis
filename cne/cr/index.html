function update_viz() {

  // metros cúbicos por año según el combustible (cc) y/o la region (rr)
  //
  function m3xa(cc,rr) {
    var ccc;
    if ( rr == "CL" ) {
      // CL = todo Chile
      ccc = _.filter(datos, function(n) { return n.combustible == cc; });
    }
    else {
      var rrr = _.filter(datos, function(n) { return n.region == rr; });
      ccc = _.filter(rrr, function(n) { return n.combustible == cc; });
    }

    var agrupado_c = _.groupBy(ccc, function(u) {
      return u.year;
    });

    var sumado = _.mapValues(agrupado_c, function(g) {
      return _.sum(_.pluck(g, "m3"));
    });

    return sumado;
  }

  var años = _.uniq(_.map(datos, 'year'));

  var combustibles;
  if (combustible_sel == "combustibles") {
  	combustibles = _.uniq(_.map(datos, 'combustible'));
  } else {
   	combustibles = [combustible_sel];
  }

  var ejeX;
  ejeX = _.uniq(_.map(datos, 'year'));
  ejeX.unshift("x");

  col = [];
  col[0] = ejeX;
  combus = [];

  for (var i = 0; i < combustibles.length; i++) {
    var ceros = Array.apply(null, new Array(años.length)).map(Number.prototype.valueOf,0);

    var sumados = m3xa(combustibles[i] , region_sel );

    for (var j = 0; j < años.length; j++) {
      if(sumados[años[j]]){
        ceros[j] = sumados[años[j]];
      }
    }
    col[i+1] = ceros;
    col[i+1].unshift(dict_combustible[combustibles[i].toLowerCase()]);
    combus[i] = dict_combustible[combustibles[i].toLowerCase()];
  }
  	var chart = c3.generate({
  		data: {
  			x: 'x',
  			columns: col,
  			type: 'bar',
  			groups: [
  				combus
  			]
  		},
		tooltip: {
		 grouped: false,
		  format: {
			//title: function (x) { return 'Data ' + x; }
			// name: function (name, ratio, id, index) { return name; },
			 value: function (value, ratio, id, index) { return (value.toLocaleString() + " m&#179"); }

		  }


		},
		axis : {
        		y : {
            			tick: {
                			format: d3.format(",")
            			},
            			label: {
            				text: "m3",
            				position: 'outer-center'
            			},
		    	}
    		},
		color: {
      			pattern: ["#A9A9A9","#fcae91","#fb6a4a","#de2d26","#a50f15","#a1d99b","#31a354","#deebf7","#9ecae1","#3182bd","#f2f0f7","#dadaeb","#bcbddc","#9e9ac8","#807dba","#6a51a3","#4a1486"]
    		},
  		grid: {
  			y: {
  				lines: [{value:0}]
  			}
  		},
		size: {
		  height: 425
		}
  	});
  }

function datos_comp(aa,cc,rr) {
  var aaa = _.filter(datos, function(n) { return n.year == aa; });
  var ccc = _.filter(aaa, function(n) { return cc.indexOf(n.combustible) > -1; });
  var rrr;
  if ( rr == "CL" ) {
    rrr = ccc;
  } else {
    rrr = _.filter(ccc, function(n) { return n.region == rr; });
  }
  var agrupado_c = _.groupBy(rrr, function(u) {
      return u.combustible;
    });
  var sumado = _.mapValues(agrupado_c, function(g) {
      return _.sum(_.pluck(g, "m3"));
    });
  return sumado;
}

function fila(tbl, nombre,v1,v2) {
	if (v1>0 || v2>0) {
	  var tr = tbl.append("tr");
	  tr.append("td").text(nombre);
	  tr.append("td").style("text-align","right").text((v1>0 ? v1.toLocaleString() : ""));
	  tr.append("td").style("text-align","right").text((v2>0 ? v2.toLocaleString() : ""));
	  if (v1>0 && v2>0) {
		var vr =Math.round((v2-v1)/v2*100);
		var ico = (vr>0 ? "triangle-top" : (vr<0 ? "triangle-bottom" : "minus"));
		var color = (vr>0 ? "green" : (vr<0 ? "red" : "grey"));
		tr.append("td").style("text-align","right").text(vr + "%").append("span").attr("class","glyphicon glyphicon-"+ico).style("color",color);
		tr.append("td").style("text-align","right").style("color",(v2-v1 < 0 ? "red" : "black")).text((v2-v1).toLocaleString());
	  }
	  else {
		tr.append("td").style("text-align","right").text("");
		tr.append("td").style("text-align","right").text("");
	  }
	}
}

  fila(tbody,'Kerosene de Aviación', datos_tabla_a1.KEROSENE_AVIACION, datos_tabla_a2.KEROSENE_AVIACION);
  fila(tbody,'Kerosene Doméstico', datos_tabla_a1.KEROSENE_DOMESTICO, datos_tabla_a2.KEROSENE_DOMESTICO);
  fila(tbody,'Petróleo Combustible 180', datos_tabla_a1.P_COMBUSTIBLE_180, datos_tabla_a2.P_COMBUSTIBLE_180);
  fila(tbody,'Petróleo Combustible 5', datos_tabla_a1.P_COMBUSTIBLE_5, datos_tabla_a2.P_COMBUSTIBLE_5);
  fila(tbody,'Petróleo Combustible 6', datos_tabla_a1.P_COMBUSTIBLE_6, datos_tabla_a2.P_COMBUSTIBLE_6);
  fila(tbody,'Petróleo Diesel', datos_tabla_a1.P_DIESEL, datos_tabla_a2.P_DIESEL);
  fila(tbody,'Petróleo Diesel A1', datos_tabla_a1.P_DIESEL_A1, datos_tabla_a2.P_DIESEL_A1);
  fila(tbody,'Petróleo Diesel B', datos_tabla_a1.P_DIESEL_B, datos_tabla_a2.P_DIESEL_B);
  fila(tbody,'Petróleo Diesel Invernal', datos_tabla_a1.P_DIESEL_INVERNAL, datos_tabla_a2.P_DIESEL_INVERNAL);
  fila(tbody,'Petróleo Diesel B1', datos_tabla_a1.P_DIESEL_B1, datos_tabla_a2.P_DIESEL_B1);
  fila(tbody,'Petróleo Diesel B2', datos_tabla_a1.P_DIESEL_B2, datos_tabla_a2.P_DIESEL_B2);
}

function DatosMapa() {
  var mdata = {};
  var kv;
  _.forEach(regiones, function(n, key) {
    if (key != "CL") {
      if (key == region_sel) {
        kv = {'fillKey': 'selected'};
      }
      else {
        kv = {'fillKey': 'defaultFill'};
      }
      mdata[key] = kv;
    }
  });
  return mdata;
}

function mapa() {

  map = new Datamap({
    element: document.getElementById('container'),
    geographyConfig: {
      dataUrl: 'regiones1e3.topojson'
    },
    scope: 'regiones',
    fills: {
      defaultFill: '#aaa',
      selected: 'yellow'

    },

      done: function(datamap) {
	              datamap.svg.selectAll('.datamaps-subunit').on('click', function(geography) {
	                  // alert(geography.id + " " + geography.properties.name);
	                  // region_sel = geography.id;
	                  document.getElementById('region').value = geography.id;
	                  document.getElementById('region').focus();
	                  update_region();
                  });
      },

    setProjection: function(element) {

      var projection = d3.geo.mercator()
        .center([-70, -40])
        .scale( element.offsetHeight )
        .translate([element.offsetWidth / 2, element.offsetHeight / 2]);

       var path = d3.geo.path().projection(projection);
       return {path: path, projection: projection};
    }
  });
}

function update_mapa(){
	console.log(DatosMapa());
	map.updateChoropleth(DatosMapa());
