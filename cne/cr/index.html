<script>
var regiones = {
  "CL": "Chile",
  "CL-AI": "XI de Aysén del General Carlos Ibáñez del Campo",
  "CL-AN": "II de Antofagasta",
  "CL-AP": "XV Arica y Parinacota",
  "CL-AR": "IX de la Araucanía",
  "CL-AT": "III de Atacama",
  "CL-BI": "VIII del Biobío",
  "CL-CO": "IV de Coquimbo",
  "CL-LI": "VI del Libertador General Bernardo O'Higgins",
  "CL-LL": "X de Los Lagos",
  "CL-LR": "XIV de los Ríos",
  "CL-MA": "XII de Magallanes y de la Antártica Chilena",
  "CL-ML": "VII del Maule",
  "CL-RM": "Metropolitana de Santiago",
  "CL-TA": "I de Tarapacá",
  "CL-VS": "V de Valparaíso"
};

  d3.select("select#region").on("change", function() {
    var str = "Venta de " + d3.select("#combustible").node().value + " en " + regiones[d3.select("#region").node().value];
    d3.select("#titulo_variable").text( str );
  });

  d3.select("select#combustible").on("change", function() {
    var str = "Venta de " + d3.select("#combustible").node().value + " en " + regiones[d3.select("#region").node().value];
    d3.select("#titulo_variable").text( str );
  });

  var datos;
  var col = [];

  d3.json("datos.json", function(error, json) {
    if (error) return console.warn(error);
    datos = json;
    viz();
  });

  function viz() {

  // metros cubicos x año (segun un combustible dado)
  //
  function m3xa(cc) {
    var ccc = _.filter(datos, function(n) { return n.combustible == cc; });

    var agrupado_c = _.groupBy(ccc, function(u) {
      return u.year;
    });

    var sumado = _.mapValues(agrupado_c, function(g) {
      return _.sum(_.pluck(g, "m3"));
    });

    return sumado;
  }

  var años = _.uniq(_.map(datos, 'year'));
  var combustibles = _.uniq(_.map(datos, 'combustible'));

  var ejeX;
  ejeX = _.uniq(_.map(datos, 'year'));
  ejeX.unshift("x");

  col[0] = ejeX;
  for (var i = 0; i < combustibles.length; i++) {
    var ceros = Array.apply(null, new Array(años.length)).map(Number.prototype.valueOf,0);

    var sumados = m3xa(combustibles[i]);

    for (var j = 0; j < años.length; j++) {
      if(sumados[años[j]]){
        ceros[j] = sumados[años[j]];
      }
    }
    col[i+1] = ceros;
    col[i+1].unshift(combustibles[i]);
  }

  	var chart = c3.generate({
  		data: {
  			x: 'x',
  			columns: col,
  			type: 'bar',
  			groups: [
  				combustibles
  			]
  		},
  		grid: {
  			y: {
  				lines: [{value:0}]
  			}
  		},
		size: {
		  height: 425
		},
		tooltip: {
  		        grouped: false
          }
  	});


  }


</script>
