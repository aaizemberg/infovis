<!DOCTYPE html>
<html>
<head>
<script src="http://d3js.org/d3.v3.min.js"></script>
  <meta charset="utf-8">
  <title>leyendo el json array desde d3.js</title>
</head>
<body>
  <div id="loading" class="loading">Loading...</div>
  <div id="laviz"></div>

<script>
var key = "2ce4c68fc14604cfc6641713d062479044fa33df";
var url = "http://cne.cloudapi.junar.com/datastreams/invoke/VENTA-NACIO-POR-PRODU-29591?auth_key=" + key + "&output=json_array";

var data;

d3.json(url, function(error, json) {
  if (error) return console.warn(error);
  // procesar el json si hace falta, antes de asignarlo a data
  data = json;
  visualizeit(); 
});

function visualizeit() {
  d3.select("div#loading").attr("class","done").text("");
  d3.select("div#laviz").append("p").html("Listo, ya tango los datos para mostrar la viz de: <b>" + data.title + "</b>");
}
</script>
  
</body>
</html>
