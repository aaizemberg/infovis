				<option value="CL-ML">Región del Maule</option>
				<option value="CL-BI">Región del Biobío</option>
				<option value="CL-AR">Región de la Araucanía</option>

				<option value="CL-AI">Región Aisén del Gral. Carlos Ibáñez del Campo</option>
				<option value="CL-MA">Región de Magallanes y de la Antártica Chilena</option>

	<div class="row">
		<div class="col-md-1" id="metac">
	      <div id="container" style="position: relative; width: 100px; height: 500px;"></div>
		</div>
		<div class="col-md-7" id="chart">BARRAS</div>
		<div class="col-md-4" valign="top" id="referencias">REFERENCIAS</div>

</div>
<script>

//
// "Tipo_cliente","Nombre_region","Nombre_comuna","SumaDeEnergía (kWh)","Energía Promedio por Cliente (KWh)","Clientes Promedio"
//

// Considerar solo la columna D (Suma Energía kWh) para el gráfico.
// La unidad es kilowatts hora.
// Otro comentario: hay comunas repetidas porque hay más de una distribuidora energética.
// La alternativa es sumar las comunas iguales y expresar el consumo total de la comuna.

var regiones = {
  "CL": "Chile",
  "CL-AI": "XI de Aysén del General Carlos Ibáñez del Campo",
  "CL-AN": "II de Antofagasta",
  "CL-AP": "XV Arica y Parinacota",
  "CL-AR": "IX de la Araucanía",
  "CL-AT": "III de Atacama",
  "CL-BI": "VIII del Biobío",
  "CL-CO": "IV de Coquimbo",
  "CL-LI": "VI del Libertador General Bernardo O'Higgins",
  "CL-LL": "X de Los Lagos",
  "CL-LR": "XIV de los Ríos",
  "CL-MA": "XII de Magallanes y de la Antártica Chilena",
  "CL-ML": "VII del Maule",
  "CL-RM": "Metropolitana de Santiago",
  "CL-TA": "I de Tarapacá",
  "CL-VS": "V de Valparaíso"
};

var datos;
var region_sel ="CL";



  d3.select("select#region").on("change", function() {
    update_region();
  });


// d3.csv("http://cne.opendata.junar.com/datastreams/91876-clientes-residenciales-por-region-y-comuna.csv", function(error, data) {
d3.csv("91876-clientes-residenciales-por-region-y-comuna.csv", function(error, data) {
  data.forEach(function(d) {
    _.forEach(d, function(n, key) {
	  switch(key) {
	    case "Tipo_cliente": 						// Tipo_cliente: "Residencial"
	          break;
	    case "Nombre_region": 						// Nombre_region: "Valparaíso"
	          break;
	    case "Nombre_comuna": 						// Nombre_comuna: "Zapallar"
	          break;
	    case "SumaDeEnergía (kWh)": 				// SumaDeEnergía (kWh): "14,585,310.00"
	    	  d.SumaDeEnergia = n.replace(/,/g,"").replace(".00","")
	          break;
	    case "Energía Promedio por Cliente (KWh)":	// Energía Promedio por Cliente (KWh): "2,516.00"
	    	  d.EnergiaPromedioPorCliente = n.replace(/,/g,"").replace(".00","")
	          break;
	    case "Clientes Promedio":   				// Clientes Promedio: "5,798.00"
	    	  d.ClientesPromedio = n.replace(/,/g,"").replace(".00","")
	          break;
	    default:
	          break;
	  } // switch
    }); // para cada atributo dentro del registro
  }); // para cada registro

  // genero una variable global con los datos
  datos = data;

  mapa();

  // hay que agrupar por Region, Comuna y sumar SumaDeEnergia

  /** Totales x region**/
	var agrupado_reg = _.groupBy(datos, function(u) {
		return u.Nombre_region;
    });
    var sumado_reg = _.mapValues(agrupado_reg, function(g) {
        return _.sum(_.pluck(g, "SumaDeEnergia"));
    });

    //sumado_reg  {Antofagasta: 443529819, Arica y Parinacota: 161251484, Atacama: 191762427, Coquimbo: 446180175, Región Aisén del Gral. Carlos Ibáñez del Campo: 59102872…}

  /** Totales x comuna dada una region**/
  	var region_selPR = "Valparaíso";
	var rrr = _.filter(datos, function(n) { return n.Nombre_region == region_selPR; });
	var agrupado_comu = _.groupBy(rrr, function(u) {
  		return u.Nombre_comuna;
    });
    var sumado_comu = _.mapValues(agrupado_comu, function(g) {
		return _.sum(_.pluck(g, "SumaDeEnergia"));
	});

   //sumado_comu {Algarrobo: 18872176, Cabildo: 11507779, Calera: 32795420, Calle Larga: 10945660, Cartagena: 15221732…}

/**

  x.domain(d3.extent(data, function(d) { return d.date; }));
  y.domain(d3.extent(data, function(d) { return d.close; }));

  svg.append("g")
      .attr("class", "x axis")
      .attr("transform", "translate(0," + height + ")")
      .call(xAxis);

  svg.append("g")
      .attr("class", "y axis")
      .call(yAxis)
    .append("text")
      .attr("transform", "rotate(-90)")
      .attr("y", 6)
      .attr("dy", ".71em")
      .style("text-anchor", "end")
      .text("horas");

  svg.append("path")
      .datum(data)
      .attr("class", "line")
      .attr("d", line);
**/

});

  function DatosMapa() {
	var mdata = {};
	_.forEach(regiones, function(n, key) {
		if (key != "CL") {
			if (key == region_sel) {
				var kv = {'fillKey': 'selected'};
			}
			else {
				var kv = {'fillKey': 'defaultFill'};
			}
			mdata[key] = kv;
		}
 	});
	return mdata;
  }


  function update_region() {
    region_sel = d3.select("#region").node().value;
    update_mapa();
  }


function mapa() {

  map = new Datamap({
    element: document.getElementById('container'),
    geographyConfig: {
      dataUrl: 'regiones1e3.topojson'
    },
    scope: 'regiones',
    fills: {
      defaultFill: '#aaa',
      selected: 'yellow'

    },

      done: function(datamap) {
	              datamap.svg.selectAll('.datamaps-subunit').on('click', function(geography) {
	                  // alert(geography.id + " " + geography.properties.name);
	                  // region_sel = geography.id;
	                  document.getElementById('region').value = geography.id;
	                  document.getElementById('region').focus();
	                  update_region();
                  });
      },


    setProjection: function(element) {

      var projection = d3.geo.mercator()
        .center([-70, -40])
        .scale( element.offsetHeight )
        .translate([element.offsetWidth / 2, element.offsetHeight / 2]);

       var path = d3.geo.path().projection(projection);
       return {path: path, projection: projection};
    }
  });
}

function update_mapa(){
	console.log(DatosMapa());
	map.updateChoropleth(DatosMapa());
}

</script>

</body>
</html>
