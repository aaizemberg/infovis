<script>

  var op_sel = "I";
  var producto_sel = "Combustible";
  var year_sel = "2014";
  var pais_sel = "todo el mundo";
  var datamap;


function texto (pais3) {
    var str;
    var pais = "todo el mundo";
    if (pais3 != "*") {
      //buscar la descripcion de pais!!
      //pais= pais3;
      pais= paises[pais3].pais;
    }
    if (op_sel == "I" ) {
          str = d3.select("#producto").node().value + " importado en " + d3.select("#year").node().value + " desde " + pais + " hacia Chile";
    } else {
          str = d3.select("#producto").node().value + " exportado en " + d3.select("#year").node().value + " desde Chile hacia " + pais;
    }
    d3.select("#titulo_variable").text( str );
}

  d3.select("select#op").on("change", function() {
  	op_sel = d3.select("#op").node().value;
	texto("*");
	tabla("*");
    mapa();
  });

  d3.select("select#year").on("change", function() {
  	year_sel = d3.select("#year").node().value;
	texto("*");
	tabla("*");
    mapa();
  });

  d3.select("select#producto").on("change", function() {
    	producto_sel = d3.select("#producto").node().value;
  	texto("*");
  	tabla("*");
    mapa();
  });

  var datos;

  d3.tsv("http://aaizemberg.github.io/infovis/cne/ie/datos.tsv", function(error, datos_tsv) {
    if (error) return console.warn(error);
    datos = datos_tsv;
    mapa();
    tabla("*");
  });

  var gg;

  function tabla(pais3) {
    var oo = _.filter(datos, function(n) { return n.operacion == op_sel; });

    var yy = _.filter(oo, function(n) { return n.year == year_sel; });

    var pp = yy;

    if (pais3 != "*") {
         pp = _.filter(yy, function(n) { return n.pais3 == pais3; });
    }

    var qq;
    if (producto_sel != "Combustible") {
        // Filtro solo el porducto seleccionado
        qq = _.filter(pp, function(n) { return n.producto == producto_sel; });
    } else {
      qq=pp;
    }

    // Agrupo por porducto
      agrupado = _.groupBy(qq, function(u) {
        return u.producto;
      });

    var sumado = _.mapValues(agrupado, function(g) {
      return _.sum(_.pluck(g, "ton_punto"));
    });

//    console.log(sumado);

    gg = sumado;


// Mostrar diferente para un solo (producto_sel != "Combustible")
      d3.select("table#tbl").data([]).exit().remove();
      d3.select("div#tabla-combustible").append("table").attr("id","tbl").attr("class","table table-striped");
      var tbl = d3.select("table.table-striped");

      var thead = tbl.append("thead");
      var th = thead.append("tr");

    // titulos
      th.append("th").text("Combustible");
      th.append("th").style("text-align","right").text("TON");
      var tbody = tbl.append("tbody");

      var tr;

      _.forEach(sumado, function(n, key) {
  //        console.log(n);
  //        console.log(key);
          tr = tbody.append("tr");
          tr.append("td").text(key);
          tr.append("td").style("text-align","right").text(Math.round(n).toLocaleString());
      });

  }

  function DatosMapa() {
    var oo = _.filter(datos, function(n) { return n.operacion == op_sel; });
    var yy = _.filter(oo, function(n) { return n.year == year_sel; });
    var qq;
    if (producto_sel != "Combustible") {
        // Filtro solo el porducto seleccionado
      qq = _.filter(yy, function(n) { return n.producto == producto_sel; });
    } else {
      qq = yy;
    }
    // Agrupo por porducto
      agrupado = _.groupBy(qq, function(u) {
        return u.pais3;
      });

    var sumado = _.mapValues(agrupado, function(g) {
      return _.sum(_.pluck(g, "ton_punto"));
    });

    var minimo = _.min(sumado);
    var maximo = _.max(sumado);
    var cantidad = _.size(sumado);

	var escala = d3.scale.linear().domain([minimo,maximo]).range([1,11]);
	var mdata = {};
	_.forEach(sumado, function(n, key) {
	  if (key != "") {
		  var kv = {'fillKey': Math.round(escala(n))};
		  mdata[key] = kv;
	  }
	});

	console.log(mdata);

	//Paleta
	d3.select("div#paleta").data([]).exit().remove();
	d3.select("div#contpaleta").append("div").attr("id","paleta");

	  var colores = ["#313695","#4575b4","#74add1","#abd9e9","#e0f3f8","#ffffbf","#fee090","#fdae61","#f46d43","#d73027","#a50026"];
	  var ancho = 20, alto = 20, spacing = 1;

	// creo el SVG dentro del DIV paleta
	  var svg = d3.select("div#paleta")
	            .append("svg")
	            .attr("width",ancho*colores.length)  // cada cuadradito es de 20px, tengo 11
	            .attr("height",3 * alto);

	// creo los 11 rectangulos y los coloreo
	  svg.selectAll("rect").data(colores).enter().append("rect")
	   .attr("width",ancho-spacing)
	   .attr("height",alto)
	   .attr("x", function(d,i) { return i * ancho;}  )
	   .style("fill", function(d,i) { return d;} );

	// escribo min y max
	  svg.append("text").attr("x",0).attr("y",alto+15).attr("text-anchor","start").text(minimo.toLocaleString());
	  svg.append("text").attr("x",ancho*colores.length).attr("y",alto+15).attr("text-anchor","end").text(maximo.toLocaleString());



	return mdata;
  }


  function mapa() {

	d3.select("div#container").data([]).exit().remove();
	d3.select("div#metac").append("div").attr("id","container").style("position","relative").style("height","550px");

    datamap = new Datamap({
      element: document.getElementById('container'),
      fills: {
      defaultFill: "#eee",
        1: "#313695",
        2: "#4575b4",
        3: "#74add1",
        4: "#abd9e9",
        5: "#e0f3f8",
        6: "#ffffbf",
        7: "#fee090",
        8: "#fdae61",
        9: "#f46d43",
        10: "#d73027",
        11: "#a50026"
      },
      data: DatosMapa(),

      geographyConfig: {
	          popupTemplate: function(geography, data) {
	            return '<div class="hoverinfo"><strong>' + paises[geography.id].pais  + '</strong></div>';
	          },
      },


      done: function(datamap) {
	              datamap.svg.selectAll('.datamaps-subunit').on('click', function(geography) {
	               //   alert(geography.id + " " + geography.properties.name);
	                  tabla(geography.id);
                      texto(geography.id);
                  });
      }

      //
      // cada pais es dibujado como un PATH SVG con class="datamaps-subunit ARG" con su codigo de tres dígitos.
      //

    });
  } // mapa

  function updateMap() {
    datamap.updateChoropleth(DatosMapa());
  }

</script>
