      <h5 id="titulo_variable">Combustible importado en 2014 desde todo el mundo hacia Chile</h5>
      <img src="tabla-fake.jpg" alt="tabla">

<script>

  var op_sel = "I";
  var producto_sel = "Combustible";
  var year_sel = "2014";
  var pais_sel = "todo el mundo";


function texto () {
    var str;
    if (op_sel == "I" ) {
          str = d3.select("#producto").node().value + " importado en " + d3.select("#year").node().value + " desde " + pais_sel + " hacia Chile";
    } else {
          str = d3.select("#producto").node().value + " exportado en " + d3.select("#year").node().value + " desde Chile hacia " + pais_sel;
    }
    d3.select("#titulo_variable").text( str );
}

  d3.select("select#op").on("change", function() {
  	op_sel = d3.select("#op").node().value;
	texto();
	tabla("*");
  });

  d3.select("select#year").on("change", function() {
  	year_sel = d3.select("#year").node().value;
	texto();
	tabla("*");
  });

  d3.select("select#producto").on("change", function() {
    	producto_sel = d3.select("#producto").node().value;
  	texto();
  	tabla("*");
  });


  var datos;


  d3.tsv("datos.tsv", function(error, datos_tsv) {
   if (error) return console.warn(error);
   datos = datos_tsv;
   mapa();
   tabla("*");
  });
  var gg;


  function tabla (pais3) {
	//tabla para todos los productos
    console.log("tabla");
    var oo = _.filter(datos, function(n) { return n.operacion == op_sel; });
    var yy = _.filter(oo, function(n) { return n.year == year_sel; });

    var pp = yy;

    if (pais3 != "*") {
         pp = _.filter(yy, function(n) { return n.pais3 == pais3; });
    }


    var qq;
    if (producto_sel != "Combustible") {
        // Filtro solo el porducto seleccionado
        qq = _.filter(pp, function(n) { return n.producto == producto_sel; });
    } else {
      qq=pp;
    }

    // Agrupo por porducto
      agrupado = _.groupBy(qq, function(u) {
        return u.producto;
      });


    var sumado = _.mapValues(agrupado, function(g) {
      return _.sum(_.pluck(g, "ton_punto"));
    });


    gg=sumado;


    // hacer la tabla o el cuadradito segun producto_sel = "Combustible"

  }

      fills: {
      defaultFill: "#aaa",
        1: "#f7fcf5",
        2: "#e5f5e0",
        3: "#c7e9c0",
        4: "#a1d99b",
        5: "#74c476",
        6: "#41ab5d",
        7: "#238b45",
        8: "#006d2c",
        9: "#00441b"
      },
      data: {
        'ARG': {'fillKey': 9, 'cant': 100},
        'BRA': {'fillKey': 8, 'cant': 100},
        'BEL': {'fillKey': 3, 'cant': 100},
        'CAN': {'fillKey': 4, 'cant': 100},
        'CHE': {'fillKey': 5, 'cant': 100},
        'CHN': {'fillKey': 6, 'cant': 100},
        'DEU': {'fillKey': 7, 'cant': 100},
        'DNK': {'fillKey': 8, 'cant': 100},
        'USA': {'fillKey': 9, 'cant': 100},
        'EGY': {'fillKey': 1, 'cant': 100},
        'FIN': {'fillKey': 2, 'cant': 100},
        'FRA': {'fillKey': 3, 'cant': 100},
        'IDN': {'fillKey': 4, 'cant': 100},
        'IND': {'fillKey': 5, 'cant': 100},
        'JPN': {'fillKey': 6, 'cant': 100},
        'KOR': {'fillKey': 7, 'cant': 100},
        'NLD': {'fillKey': 8, 'cant': 100},

        'SIN': {'fillKey': 2, 'cant': 100},

        'GBR': {'fillKey': 4, 'cant': 100}
      },
      done: function(datamap) {
	              datamap.svg.selectAll('.datamaps-subunit').on('click', function(geography) {
	               //   alert(geography.id + " " + geography.properties.name);
	                  tabla(geography.id);
                  });
      }

      //
