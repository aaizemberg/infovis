<!DOCTYPE html>
<html>
<head>
  <script src="http://d3js.org/d3.v3.min.js"></script>
  <meta charset="utf-8">
  <title>Importaciones y Exporaciones</title>
</head>
<body>
<h1>Importaciones y exportaciones</h1>
  
  <table>
    <tr>
      <td>operacion</td>
      <td>año</td>
      <td>tipo de combustible</td>
    </tr>
    <tr>
      <td>
        <select id="op">
          <option value="imp">Importación</option>
          <option value="exp">Exportación</option>
        </select>        
      </td>
      <td>
        <select id="year">
          <option value='2002'>2002</option>
          <option value='2003'>2003</option>
          <option value='2004'>2004</option>
          <option value='2005'>2005</option>
          <option value='2006'>2006</option>
          <option value='2007'>2007</option>
          <option value='2008'>2008</option>
          <option value='2009'>2009</option>
          <option value='2010'>2010</option>
          <option value='2011'>2011</option>
          <option value='2012'>2012</option>
          <option value='2013'>2013</option>
          <option value='2014'>2014</option>
          <option value='2015'>2015</option>
        </select>        
      </td>
      <td>
        <select id="producto">
          <option value='Carbón'>Carbón</option>
          <option value='Crudo'>Crudo</option>
          <option value='Diesel'>Diesel</option>
          <option value='Fuel Oil 6'>Fuel Oil 6</option>
          <option value='GLP'>GLP</option>
          <option value='Gas Natural'>Gas Natural</option>
          <option value='Gasolina'>Gasolina</option>
          <option value='IFO'>IFO</option>
          <option value='Kerosene'>Kerosene</option>
        </select>        
      </td>
    </tr>
  </table>
  
  <!-- 940 px como minimo, entre el mapa y las referencias -->
  <table width="940px">
    <tr>
      <td width="840px" >
        <div id="mapa">
          <p>mapa mapa mapa</p>
        </div>
      </td>
      <td width="100px" align="right">
        <div id="ref">
          <p>tablita </p>
        </div>
      </td>
    </tr>
  </table>
  
</body>
</html>
