<!DOCTYPE html>
<html>
<head>

<!-- lodash -->
<script src="https://rawgit.com/lodash/lodash/3.8.0/lodash.min.js"></script>

<!-- bootstrap -->
<script src="https://code.jquery.com/jquery.min.js"></script>
<link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.4/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.4/js/bootstrap.min.js"></script>

<!-- d3 y topojson -->
<script src="http://d3js.org/d3.v3.min.js"></script>
<script src="http://d3js.org/topojson.v1.min.js"></script>

<!-- datamaps -->
<script src="datamaps.world.min.js"></script>

<style>
  body {
    padding-top: 1px;
    padding-left: 1px;
  }
  @media (max-width: 980px) {
    body {
      padding-top: 1;
    }
  }
  .container {width:100%;max-width:none;padding:20;}
  table {
  	font-size: small;
  }
</style>  <meta charset="utf-8">
  <title>Importaciones y Exporaciones</title>
</head>
<body>
<div class="container">
  <h1>Importaciones y Exportaciones</h1>

  <div class="row">
    <div class="col-md-2" >Operacion</div>
    <div class="col-md-2" >Año</div>
    <div class="col-md-2" >Combustible</div>
    <div class="col-md-6"></div>
  </div>
  <div class="row">
    <div class="col-md-2" >
      <select id="op" class="form-control">
          <option value="imp">Importación</option>
          <option value="exp">Exportación</option>
      </select>
    </div>
    <div class="col-md-2">
      <select id="year"  class="form-control">
          <option value='2002'>2002</option>
          <option value='2003'>2003</option>
          <option value='2004'>2004</option>
          <option value='2005'>2005</option>
          <option value='2006'>2006</option>
          <option value='2007'>2007</option>
          <option value='2008'>2008</option>
          <option value='2009'>2009</option>
          <option value='2010'>2010</option>
          <option value='2011'>2011</option>
          <option value='2012'>2012</option>
          <option value='2013'>2013</option>
          <option value='2014' selected>2014</option>
          <option value='2015'>2015</option>
      </select>
    </div>
    <div class="col-md-2" >
      <select id="producto" class="form-control">
          <option value='Combustible'>Todos</option>
          <option value='Carbón'>Carbón</option>
          <option value='Crudo'>Crudo</option>
          <option value='Diesel'>Diesel</option>
          <option value='Fuel Oil 6'>Fuel Oil 6</option>
          <option value='GLP'>GLP</option>
          <option value='Gas Natural'>Gas Natural</option>
          <option value='Gasolina'>Gasolina</option>
          <option value='IFO'>IFO</option>
          <option value='Kerosene'>Kerosene</option>
      </select>
    </div>
    <div class="col-md-6"></div>
    </div>
  <hr>
  <div class="row">
    <div class="col-md-9" id="mapa-mundo">
      <div id="container" style="position: relative; height: 550px;"></div>
      <!-- <img height="550" src="mapa-fake.jpg" alt="mapa"> -->
    </div>
    <div class="col-md-3" id="tabla-combustible">
      <h5 id="titulo_variable">Combustible importado en 2014 desde todo el mundo hacia Chile</h5>
      <img src="tabla-fake.jpg" alt="tabla">
    </div>
  </div>

  </div>

<script>
  var op_sel = "imp";
  var producto_sel = "Combustible";
  var year_sel = "2014";
  var pais_sel = "todo el mundo";

  mapa();

  d3.select("select#op").on("change", function() {
    var opera = " exportado";
    if (op == "imp" ) {
        opera= " importado";
    }
    var str = " " + producto_sel + opera + " en " + d3.select("#year").node().value + " desde " + pais_sel + " hacia Chile";
    d3.select("#titulo_variable").text( str );
  });

  function mapa() {

    var mapa = new Datamap({
      element: document.getElementById('container'),
      fills: {
      defaultFill: "#aaa",
        1: "#f7fcf5",
        2: "#e5f5e0",
        3: "#c7e9c0",
        4: "#a1d99b",
        5: "#74c476",
        6: "#41ab5d",
        7: "#238b45",
        8: "#006d2c",
        9: "#00441b"
      },
      data: {
        'ARG': {'fillKey': 9, 'cant': 100},
        'BRA': {'fillKey': 8, 'cant': 100},
        'BEL': {'fillKey': 3, 'cant': 100},
        'CAN': {'fillKey': 4, 'cant': 100},
        'CHE': {'fillKey': 5, 'cant': 100},
        'CHN': {'fillKey': 6, 'cant': 100},
        'DEU': {'fillKey': 7, 'cant': 100},
        'DNK': {'fillKey': 8, 'cant': 100},
        'USA': {'fillKey': 9, 'cant': 100},
        'EGY': {'fillKey': 1, 'cant': 100},
        'FIN': {'fillKey': 2, 'cant': 100},
        'FRA': {'fillKey': 3, 'cant': 100},
        'IDN': {'fillKey': 4, 'cant': 100},
        'IND': {'fillKey': 5, 'cant': 100},
        'JPN': {'fillKey': 6, 'cant': 100},
        'KOR': {'fillKey': 7, 'cant': 100},
        'NLD': {'fillKey': 8, 'cant': 100},
        'NZL': {'fillKey': 9, 'cant': 100},
        'PAK': {'fillKey': 1, 'cant': 100},
        'SIN': {'fillKey': 2, 'cant': 100},
        'TWN': {'fillKey': 2, 'cant': 100},
        'GBR': {'fillKey': 4, 'cant': 100}
      },
      done: function(datamap) {
	              datamap.svg.selectAll('.datamaps-subunit').on('click', function(geography) {
	                  alert(geography.id + " " + geography.properties.name);
	              });
      }

      //
      // cada pais es dibujado como un PATH SVG con class="datamaps-subunit ARG" con su codigo de tres dígitos.
      //

    });
  }

 </script>

</body>
</html>
