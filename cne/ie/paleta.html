<!DOCTYPE html>
<html>
<head>
<script src="http://d3js.org/d3.v3.min.js"></script>
  <meta charset="utf-8">
  <title>paleta</title>
</head>
<body>

  <div id="paleta"></div>
  
<script>
  var min = 0, max = 303456;
  var colores = ["#313695","#4575b4","#74add1","#abd9e9","#e0f3f8","#ffffbf","#fee090","#fdae61","#f46d43","#d73027","#a50026"];
  var ancho = 20, alto = 20, spacing = 1;

// creo el SVG dentro del DIV paleta
  var svg = d3.select("div#paleta")
            .append("svg")
            .attr("width",ancho*colores.length)  // cada cuadradito es de 20px, tengo 11
            .attr("height",3 * alto);

// creo los 11 rectangulos y los coloreo
  svg.selectAll("rect").data(colores).enter().append("rect")
   .attr("width",ancho-spacing)
   .attr("height",alto)
   .attr("x", function(d,i) { return i * ancho;}  )
   .style("fill", function(d,i) { return d;} );

// escribo min y max
  svg.append("text").attr("x",0).attr("y",alto+15).attr("text-anchor","start").text(min.toLocaleString());
  svg.append("text").attr("x",ancho*colores.length).attr("y",alto+15).attr("text-anchor","end").text(max.toLocaleString());
  
</script>  
  
</body>
</html>
