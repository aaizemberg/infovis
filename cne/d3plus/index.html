<!doctype html>
<meta charset="utf-8">
 
<script src="http://www.d3plus.org/js/d3.js"></script>
<script src="http://www.d3plus.org/js/d3plus.js"></script>
 
<div id="viz"></div>
<script> 
var data = [
    {"año": 2006, "name":"gasolina", "m3": 100},
    {"año": 2006, "name":"diesel", "m3": 48},
    {"año": 2006, "name":"kerosene", "m3": 50},
    {"año": 2007, "name":"gasolina", "m3": 130},
    {"año": 2007, "name":"diesel", "m3": 56},
    {"año": 2007, "name":"kerosene", "m3": 80},
    {"año": 2008, "name":"gasolina", "m3": 125},
    {"año": 2008, "name":"diesel", "m3": 36},
    {"año": 2008, "name":"kerosene", "m3": 74},

  ];

  var visualization = d3plus.viz()
    .container("#viz")
    .data(data)
    .type("bar")
    .id("name")
    .y({"stacked": true, "value": "m3"})
    .x("año")
    .time("año")
    .draw();
</script>
